# Refer for explanation to following link:
# https://github.com/evilmartians/lefthook/blob/master/docs/full_guide.md
#
glob_matcher: doublestar

pre-commit:
  commands:
    format:
      glob: '**/*.{js,ts,jsx,tsx}'
      run: yarn prettier --write {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    type-check:
      glob: '**/*.{ts,tsx}'
      run: yarn types
    lint:
      glob: '**/*.{js,ts,jsx,tsx}'
      run: yarn lint
